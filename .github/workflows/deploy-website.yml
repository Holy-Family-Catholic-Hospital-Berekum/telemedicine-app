name: Deploy website

# Builds the website and publishes it to Firebase Hosting:
#   push to main -> live project (telemedicine-hfch, https://telemedicine.hfhberekum.org)
#   push to test -> test project (telemedicine-hfch-test, https://telemedicine-hfch-test.web.app)
#
# First it runs the security pipeline (security-audit.yml: TruffleHog,
# ESLint, Semgrep, Snyk, GitGuardian); the deploy only starts if that passes.
#
# No key file anywhere: GitHub proves who it is to Google (Workload Identity
# Federation) and Google lets ONLY this repository's main branch deploy to
# live and its test branch deploy to test (HANDOVER.md "Website deploys").
# The service account it acts as can only publish hosting.
#
# Settings come from the GitHub environment ("live" or "test", each limited
# to its branch): variables for the public web config, a secret for the
# hidden staff sign-in path. The repository is public: never put the staff
# path, or anything else private, in this file.
on:
  push:
    branches: [main, test]
    paths-ignore:
      - "functions/**"
      - "tests/**"
      - "e2e/**"
      - "**/*.md"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - ".github/workflows/rules-tests.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time, in order; never cancel one halfway.
concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The security pipeline (secret scans, lint, Semgrep, Snyk) must pass
  # before anything is published: if it fails, the deploy job never runs
  # and the site stays as it was.
  security:
    if: github.ref_name == 'main' || github.ref_name == 'test'
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  deploy:
    needs: security
    if: github.ref_name == 'main' || github.ref_name == 'test'
    permissions:
      contents: read
      id-token: write # only this job may sign in to Google (Workload Identity Federation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'live' || 'test' }}
      url: ${{ vars.VITE_SITE_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      # No install scripts: the build doesn't need them, and a hijacked
      # package's install script is the usual way supply-chain attacks run.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Firebase CLI from its own lockfile (.github/firebase-cli), so
      # every one of its dependencies is pinned and integrity-checked; this
      # is the code that runs with the deploy credential.
      - name: Install the Firebase CLI
        run: npm ci --prefix .github/firebase-cli --ignore-scripts --no-audit --no-fund

      - name: Build the website
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ vars.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_STAFF_LOGIN_PATH: ${{ secrets.VITE_STAFF_LOGIN_PATH }}
          # The test website is public: keep it out of search engines.
          VITE_SEARCH_INDEXING: ${{ github.ref_name == 'main' && 'on' || 'off' }}
          # Live, once its domain points at Firebase: send visits to the
          # web.app / firebaseapp.com addresses to it (src/canonicalHost.js).
          VITE_CANONICAL_REDIRECT: ${{ vars.VITE_CANONICAL_REDIRECT }}

      # Refuse to publish a build that's missing its settings or points at
      # the other project (the page would load but nothing would work).
      - name: Check the build
        env:
          PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          STAFF_PATH_SET: ${{ secrets.VITE_STAFF_LOGIN_PATH != '' }}
          TARGET: ${{ github.ref_name == 'main' && 'telemedicine-hfch' || 'telemedicine-hfch-test' }}
        run: |
          test "$PROJECT" = "$TARGET" || { echo "VITE_FIREBASE_PROJECT_ID is '$PROJECT', expected '$TARGET'"; exit 1; }
          test "$STAFF_PATH_SET" = "true" || { echo "The VITE_STAFF_LOGIN_PATH secret is missing"; exit 1; }
          test -f dist/index.html
          if grep -q 'firebase-' dist/index.html; then echo "Firebase is in the first download (CLAUDE.md 'Weak connections')"; exit 1; fi
          # Development-only switches must never reach a published site.
          if grep -rqE 'FIREBASE_APPCHECK_DEBUG_TOKEN=[^=]|127\.0\.0\.1:(9099|8080|5001|9199)' dist; then echo "App Check debug token or emulator settings in the build"; exit 1; fi
          if find dist -name '*.map' | grep -q .; then echo "Source maps in the build"; exit 1; fi

      - name: Sign in to Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Publish to Firebase Hosting
        env:
          FIREBASE_ALIAS: ${{ github.ref_name == 'main' && 'live' || 'test' }}
        run: .github/firebase-cli/node_modules/.bin/firebase deploy --only hosting --project "$FIREBASE_ALIAS" --non-interactive --message "${GITHUB_SHA::7}"
