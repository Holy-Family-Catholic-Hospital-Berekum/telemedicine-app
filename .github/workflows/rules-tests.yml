name: Automated tests

# Database/storage rules tests and the server (Cloud Functions) tests, run
# against the Firebase emulators with a demo project: nothing touches the
# live database. Runs when the rules, the functions or the tests change.
#   - tests/rules/            who may read/write what (firestore/storage rules)
#   - functions/test/unit/    waiting rule, refund amounts, age, reminders
#   - functions/test/emulator no-shows, doctor couldn't make it, closing,
#                             refunds, against a real (emulated) database
on:
  push:
    branches: [main, test]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/rules/**"
      - "functions/**"
      - ".github/workflows/rules-tests.yml"
  pull_request:
    branches: [main, test]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/rules/**"
      - "functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-telemedicine
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Firebase emulators need Java 21.
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Server unit tests
        run: npm test --prefix functions

      # Same Firebase CLI version the project deploys with.
      - name: Rules tests (emulators)
        run: >
          npx --yes firebase-tools@15.31.0 emulators:exec
          --only firestore,storage --project demo-telemedicine
          "node --test tests/rules/rules.test.mjs"

      - name: Server tests against the database (emulator)
        run: >
          npx --yes firebase-tools@15.31.0 emulators:exec
          --only firestore --project demo-telemedicine
          "cd functions && node --test --test-concurrency=1 test/emulator/*.test.js"
