name: End-to-end tests

# A robot uses the website like a patient, against a throwaway copy of the
# whole system (Firebase emulators, project demo-telemedicine): sign-up,
# booking and payment (Paystack's window stood in for), joining a video
# call with a fake camera, the doctor-waiting and doctor-missing rules, a
# refund request. Nothing touches the test or live projects, Paystack,
# email or the video relay. See e2e/ and HANDOVER.md.
on:
  push:
    branches: [main, test]
    paths:
      - "src/**"
      - "components/**"
      - "functions/**"
      - "e2e/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Firebase emulators need Java 21.
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Install the robot's browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm run test:e2e
